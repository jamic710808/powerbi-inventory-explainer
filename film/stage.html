<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<title>Power BI 庫存分析報告 · 圖解導覽（影片舞台）</title>
<style>
:root{--bg0:#070d2b;--bg1:#101c5c;--cyan:#27d3ff;--cyan2:#1b8fd6;--ink:#0b1a52;--ink2:#4a5f9a;--orange:#ff9b4a;--mint:#5ee0c0;--gold:#ffd27a;--red:#ff7a8a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070d2b;font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(1500px 950px at 70% 15%,#1b348f 0%,#101c5c 42%,#070d2b 100%)}
#grid{position:absolute;inset:-100px;opacity:.09;background-image:linear-gradient(#8fb4ff 1px,transparent 1px),linear-gradient(90deg,#8fb4ff 1px,transparent 1px);background-size:80px 80px}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35}
#tag{position:absolute;left:60px;top:30px;font-size:22px;letter-spacing:.14em;color:#a9c4ff;z-index:50;display:flex;align-items:center;gap:30px}
#tag i{width:14px;height:14px;border-radius:3px;background:var(--cyan);display:inline-block;box-shadow:18px 0 0 -2px var(--orange)}
#pg{position:absolute;left:880px;top:24px;z-index:50;font-size:24px;font-weight:800;color:#07102e;background:var(--cyan);padding:2px 20px;border-radius:18px;opacity:0;white-space:nowrap}
#step{position:absolute;right:60px;top:32px;font-size:22px;color:#a9c4ff;letter-spacing:.12em;z-index:50}
#badge{position:absolute;right:190px;top:26px;z-index:50;font-size:21px;font-weight:800;color:#07102e;background:var(--gold);padding:3px 16px;border-radius:16px}
#prog{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--cyan),var(--orange));z-index:60}
#sub{position:absolute;left:0;right:0;bottom:44px;text-align:center;z-index:55;height:66px}
#sub span{display:inline-block;padding:10px 34px;border-radius:40px;background:rgba(4,10,34,.78);font-size:40px;letter-spacing:.06em;line-height:1.25;backdrop-filter:blur(6px);max-width:1800px}
.scene{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
.win{position:absolute;left:60px;top:90px;width:1800px;height:810px;border-radius:22px;overflow:hidden;background:#0d1642;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.12)}
.cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.cam img{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
.spot{position:absolute;border:4px solid var(--orange);border-radius:10px;box-shadow:0 0 0 4000px rgba(5,12,40,.30);opacity:0}
.cap{position:absolute;left:60px;top:908px;max-width:1800px;padding:6px 26px 6px 22px;border-radius:14px;background:rgba(255,255,255,.97);color:var(--ink);border-left:10px solid var(--orange);font-size:34px;font-weight:800;letter-spacing:.03em;opacity:0;box-shadow:0 10px 30px rgba(0,0,0,.35);white-space:nowrap;line-height:1.3}
.big{position:absolute;font-weight:800;letter-spacing:.02em}
.card{position:absolute;border-radius:22px;background:rgba(255,255,255,.97);color:var(--ink);box-shadow:0 22px 60px rgba(0,0,0,.4)}
.mono{font-family:Consolas,"Cascadia Mono","Microsoft JhengHei",monospace}
</style></head>
<body><div id="stage">
<div id="grid"></div>
<div class="orb" id="o1" style="width:520px;height:520px;background:#1b8fd6;left:-120px;top:600px"></div>
<div class="orb" id="o2" style="width:420px;height:420px;background:#ff9b4a;right:-80px;top:-100px;opacity:.16"></div>
<div id="tag"><i></i>POWER BI · 庫存分析報告 · 圖解導覽</div>
<div id="pg"></div>
<div id="badge">示範資料（模擬）</div><div id="step"></div>
<div id="scenes"></div>
<div id="sub"><span></span></div>
<div id="prog"></div>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,t)=>a+(b-a)*t;
const eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, eO=t=>1-Math.pow(1-clamp(t),3), eOB=t=>{t=clamp(t);const c=1.5;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const IMG=i=>`../assets/p${i}_hi.jpg`;
let TL, S={}, SC={};
const IW=1920, IH=1080, AW=1800, AH=810, MAXZ=2.6;

/* ---------- 句界（字幕與鏡頭共用）：旁白從 sc.A 開始，句長以字數比例估計 ---------- */
function clausesOf(sc){ const parts=sc.text.replace(/\s+/g,' ').split(/(?<=[，。？：；])/).map(s=>s.trim()).filter(Boolean);
  const tot=parts.reduce((a,p)=>a+p.length,0); let acc=0; const A=.5+(sc.lead||0), V=sc.vo;
  return parts.map(p=>{const t0=A+V*acc/tot; acc+=p.length; return {t0,t1:A+V*acc/tot,text:p.replace(/[，。？：；]$/,'')};}); }
// 場景 k 第 i 句的時刻（相對場景起點，秒）：t0 + f×句長 + d
const ct=(k,i,d=0,f=0)=>{const c=SC[k].cl[i]; return c.t0+f*(c.t1-c.t0)+d;};

/* ---------- 共用：螢幕視窗 + 鏡頭 + 聚光框 + 說明列 ---------- */
function camOf(r){let [x,y,w,h]=r; if(w<1900){w*=1.16;h*=1.16;} return {s:Math.min(AW/w,AH/h,MAXZ),cx:x+r[2]/2,cy:y+r[3]/2};}   // 留邊：推近與平移時不裁掉被標示的數字
function place(s,cx,cy){
  const pw=IW*s, ph=IH*s; let tx=AW/2-cx*s, ty=AH/2-cy*s;
  tx= pw<=AW ? (AW-pw)/2 : Math.min(0,Math.max(AW-pw,tx));
  ty= ph<=AH ? (AH-ph)/2 : Math.min(0,Math.max(AH-ph,ty));
  return [tx,ty];}
const WHOLE=[0,0,1920,1080];
// shots: [{t:秒 | c:句序,d:偏移,f:句內比例, cam:[x,y,w,h](省略=沿用), spot:[x,y,w,h]|null, cap}]
function shotScene(k,pg,label,shots){
  const el=document.createElement('div'); el.className='scene';
  el.innerHTML=`<div class="win"><div class="cam"><img src="${IMG(pg)}"><div class="spot"></div></div></div><div class="cap"></div>`;
  const cam=el.querySelector('.cam'), spot=el.querySelector('.spot'), cap=el.querySelector('.cap');
  let ready=false; const TR=.7;
  function prep(){ let prev=-1; shots.forEach((s,i)=>{ s.T = s.t!=null ? s.t : ct(k,s.c,s.d||0,s.f||0); s.T=Math.max(s.T,prev+.05); prev=s.T; if(!s.cam) s.cam=shots[i-1].cam; }); ready=true; }
  function upd(tl,D){
    if(!ready) prep();
    let i=0; for(let j=0;j<shots.length;j++) if(tl>=shots[j].T) i=j;
    const cur=shots[i], t0=cur.T, p=i===0?1:eIO(clamp((tl-t0)/TR));
    const a=camOf(i===0?cur.cam:shots[i-1].cam), b=camOf(cur.cam);
    const drift=1+.06*tl/D;                        // 全程緩慢推近＋微平移（純函式於時間），避免整段像素靜止
    const s=Math.exp(lerp(Math.log(a.s),Math.log(b.s),p))*drift, cx=lerp(a.cx,b.cx,p)+16*(tl/D-.5), cy=lerp(a.cy,b.cy,p);
    const [tx,ty]=place(s,cx,cy); cam.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
    const sp=cur.spot, prev=i>0?shots[i-1].spot:null, same=sp&&prev&&sp.every((v,n)=>v===prev[n]);
    let rect=null, al=0;
    if(same){rect=sp;al=1;}
    else if(sp&&prev){ if(p<.35){rect=prev;al=1-p/.35;} else if(p>.65){rect=sp;al=(p-.65)/.35;} }   // 換框：舊框淡出→鏡頭移動→新框淡入
    else if(sp){rect=sp;al=clamp((tl-t0-.3)/.35);}                                                   // 新框：鏡頭先動，框稍後淡入
    else if(prev){rect=prev;al=1-clamp((tl-t0)/.25);}                                               // 消失
    if(rect&&al>0){
      spot.style.left=rect[0]+'px';spot.style.top=rect[1]+'px';spot.style.width=rect[2]+'px';spot.style.height=rect[3]+'px';
      spot.style.borderWidth=(4/s)+'px';spot.style.borderRadius=(10/s)+'px';
      spot.style.boxShadow=`0 0 0 4000px rgba(5,12,40,${.30*al})`; spot.style.opacity=al;
    } else spot.style.opacity=0;
    if(cap.dataset.t!==(cur.cap||'')){cap.textContent=cur.cap||''; cap.dataset.t=cur.cap||'';}
    const end=(i+1<shots.length?shots[i+1].T:D); cap.style.opacity=cur.cap?clamp((tl-t0-.1)/.3)*clamp((end-tl)/.2):0;
    cap.style.transform=`translateY(${(1-eO((tl-t0-.1)/.45))*14}px)`;
  }
  return {el,upd,label};
}
const mkCard=(host,css,html)=>{const d=document.createElement('div');d.className='card';d.style.cssText=css;d.innerHTML=html;host.appendChild(d);return d;};
const PAGES=['首頁','庫存經營總覽','庫存結構與資金佔用','庫存週轉效率','庫齡、臨期與退市風險','缺貨預警與補貨決策','倉間平衡與調撥','盤點與庫存準確率'];
const SHORT=['首頁','經營總覽','結構與資金','週轉效率','庫齡與風險','缺貨與補貨','倉間調撥','盤點準確率'];
const crop=(pg,r,w)=>{const s=w/r[2];return `width:${w}px;height:${r[3]*s}px;background:url(${IMG(pg)}) ${-r[0]*s}px ${-r[1]*s}px/${IW*s}px ${IH*s}px no-repeat`;};
const KP=[256,192,866,276];            // 專題頁左上 2×2 KPI 區
const KPI={a:[256,192,416,124],b:[696,192,424,124],c:[256,344,416,124],d:[696,344,424,124]};

/* ---------- 各場景 ---------- */
function build(){
  const host=document.getElementById('scenes');

  /* s01 開場：6 個問題 */
  { const el=document.createElement('div'); el.className='scene';
    el.innerHTML=`<div class="win" style="left:960px;top:110px;width:900px;height:506px;border-radius:20px"><img id="s1bg" src="${IMG(0)}" style="position:absolute;left:0;top:0;width:900px;transform-origin:50% 40%"></div>
    <div class="big" id="s1a" style="left:90px;top:120px;font-size:96px;line-height:1.14;color:#fff">庫存分析報告</div>
    <div class="big" id="s1a2" style="left:94px;top:240px;font-size:44px;font-weight:700;color:var(--cyan);letter-spacing:.16em">POWER BI · 8 張頁面</div>
    <div class="big" id="s1b" style="left:94px;top:340px;font-size:50px;font-weight:700;color:#fff">庫存管理，要看什麼？</div>
    <div class="big" id="s1q" style="left:100px;top:410px;font-size:330px;line-height:1;color:rgba(255,155,74,.92)">?</div>
    <div class="big" id="s1n" style="left:90px;top:410px;font-size:330px;line-height:1;color:var(--orange);text-shadow:0 0 60px rgba(255,155,74,.45)">6</div>
    <div class="big" id="s1u" style="left:300px;top:565px;font-size:64px;color:#fff;letter-spacing:.14em">個問題</div>
    <div id="s1c"></div>`;
    host.appendChild(el); const row=el.querySelector('#s1c'); const chips=[];
    const QS=['錢壓在哪','轉得快嗎','哪些有風險','要不要補貨','能不能調撥','帳實相符'];
    QS.forEach((n,i)=>{const d=document.createElement('div');d.style.cssText=`position:absolute;left:${96+(i%3)*300}px;top:${760+Math.floor(i/3)*92}px;width:280px;padding:14px 8px;border-radius:40px;text-align:center;font-size:34px;font-weight:800;background:rgba(39,211,255,.16);border:2px solid var(--cyan);color:#fff;opacity:0;white-space:nowrap`;d.textContent=`${i+1}　${n}`;row.appendChild(d);chips.push(d);});
    S.s01={el,label:'',upd:(tl,D)=>{
      const bg=el.querySelector('#s1bg'); bg.style.transform=`scale(${1+.06*tl/D})`;
      const a=el.querySelector('#s1a'); a.style.opacity=1;
      const a2=el.querySelector('#s1a2'); a2.style.opacity=1;
      const b=el.querySelector('#s1b'); b.style.opacity=1;
      const q=el.querySelector('#s1q'), n=el.querySelector('#s1n'), u=el.querySelector('#s1u');
      const tq=ct('s01',1,-.1), tn=ct('s01',4,-.1);
      q.style.opacity=clamp((tl-tq)/.3)*clamp((tn+.1-tl)/.2); q.style.transform=`scale(${.7+.3*eOB((tl-tq)/.5)})`;
      n.style.opacity=clamp((tl-tn)/.25); n.style.transform=`scale(${.5+.5*eOB((tl-tn)/.6)})`;
      u.style.opacity=clamp((tl-tn-.3)/.4);
      chips.forEach((c,i)=>{const st=ct('s01',5,0,i*.15),pre=.38*clamp((tl-.3-i*.1)/.4);c.style.opacity=Math.max(pre,clamp((tl-st)/.25));c.style.transform=`translateY(${(1-eOB((tl-.3-i*.1)/.5))*30}px) scale(${1+.04*clamp(1-Math.abs(tl-st-.2)/.4)})`;});
    }}; }

  /* s02 八頁地圖 → 首頁四個數字 */
  { const inner=shotScene('s02',0,'首頁',[
      {t:0,cam:WHOLE,spot:null,cap:null},
      {c:3,d:-.2,cam:[1225,525,650,345],spot:null,cap:'首頁的四個總覽數字'},
      {c:4,d:-.2,spot:[1240,543,298,147],cap:'在庫金額 78.5 萬元'},
      {c:5,d:-.2,spot:[1556,543,298,147],cap:'在庫週轉天數 22.5 天'},
      {c:6,d:-.2,spot:[1240,708,298,146],cap:'需求缺貨率 8%'},
      {c:7,d:-.1,cap:'＝ 沒按承諾時間滿足的需求比例'},
      {c:8,d:-.2,spot:[1556,708,298,146],cap:'盤點記錄準確率 93.5%'}]);
    const el=inner.el; const mz=document.createElement('div'); mz.style.cssText='position:absolute;inset:0;z-index:5';
    mz.innerHTML=`<div class="big" style="left:0;right:0;top:76px;text-align:center;font-size:56px">8 張頁面 ＝ 2 個入口 ＋ 6 張專題</div>`; el.appendChild(mz);
    const th=[]; const W=420,H=236,gx=30,x0=(1920-(4*W+3*gx))/2;
    PAGES.forEach((n,i)=>{const d=document.createElement('div');d.className='card';
      d.style.cssText=`left:${x0+(i%4)*(W+gx)}px;top:${166+Math.floor(i/4)*(H+110)}px;width:${W}px;height:${H+78}px;padding:10px;opacity:0;overflow:hidden`;
      d.innerHTML=`<div style="width:${W-20}px;height:${(W-20)*9/16}px;border-radius:8px;overflow:hidden;background:#0d1642"><img src="${IMG(i)}" style="width:100%;display:block"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px"><span style="font-size:21px;font-weight:800;color:#fff;background:${i<2?'#27d3ff':'var(--orange)'};border-radius:18px;height:34px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;flex:none;white-space:nowrap">${i?'第'+i+'頁':'封面'}</span><span style="font-size:27px;font-weight:800;color:var(--ink);white-space:nowrap">${SHORT[i]}</span></div>`;
      mz.appendChild(d); th.push(d);});
    const lab=document.createElement('div'); lab.style.cssText='position:absolute;left:0;right:0;top:880px;text-align:center;font-size:40px;font-weight:800;color:var(--gold);opacity:0'; mz.appendChild(lab);
    S.s02={el,label:'',upd:(tl,D)=>{
      const fade=clamp((ct('s02',3,-.5)-tl)/.5)*1;           // 地圖在 c3 之前顯示
      const tIn=1;                                   // 轉場已有交叉淡化，內容一開始就在
      mz.style.opacity=tIn*fade; mz.style.display=fade<=0?'none':'block';
      el.querySelector('.win').style.opacity=1-fade;
      th.forEach((c,i)=>{const st=-.1+i*.08,v=eOB((tl-st)/.5);c.style.opacity=clamp((tl-st)/.2);
        const hot=(i===0&&tl>=ct('s02',1,-.1)&&tl<ct('s02',1,1.3))||(i===1&&tl>=ct('s02',1,1.2)&&tl<ct('s02',2,0))||(i>=2&&tl>=ct('s02',2,-.1,(i-2)*.14));
        c.style.transform=`translateY(${(1-v)*60}px) scale(${hot&&i<2?1.05:1})`;
        c.style.boxShadow=(i<2&&hot)?'0 0 0 6px #27d3ff,0 24px 60px rgba(0,0,0,.5)':(i>=2&&hot?'0 0 0 5px #ff9b4a':'');});
      lab.style.opacity=clamp((tl-ct('s02',1,-.1))/.4); lab.textContent=tl<ct('s02',2,0)?'先看首頁，再進經營總覽':'再往下鑽：6 張專題頁';
      inner.upd(tl,D);
    }}; }

  /* s03 六頁 × 六個問題 */
  { const el=document.createElement('div'); el.className='scene';
    el.innerHTML=`<div class="big" style="left:0;right:0;top:76px;text-align:center;font-size:56px">六張專題頁，六個問題</div><div id="s3c"></div>`;
    host.appendChild(el); const qs=['錢壓在哪裡？','庫存轉得快不快？','哪些貨有風險？','要不要補貨？','別的倉有沒有餘貨？','帳和實物對得上嗎？']; const cards=[];
    const W=476,TH=268,gx=34,x0=(1920-(3*W+2*gx))/2,Hc=TH+24+100;
    qs.forEach((q,i)=>{const d=document.createElement('div');d.className='card';
      d.style.cssText=`left:${x0+(i%3)*(W+gx)}px;top:${150+Math.floor(i/3)*(Hc+16)}px;width:${W}px;height:${Hc}px;padding:12px;opacity:0;overflow:hidden;`;
      d.innerHTML=`<div style="width:${W-24}px;height:${TH}px;border-radius:10px;overflow:hidden;background:#0d1642"><img src="${IMG(i+2)}" style="width:100%;display:block"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:8px"><span style="font-size:22px;font-weight:800;color:#fff;background:var(--orange);border-radius:18px;height:36px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap">第 ${i+2} 頁</span><span style="font-size:32px;font-weight:800;color:var(--ink);white-space:nowrap">${SHORT[i+2]}</span></div>
      <div style="font-size:32px;font-weight:800;color:#c8581a;margin-top:2px">${q}</div>`;
      el.querySelector('#s3c').appendChild(d);cards.push(d);});
    S.s03={el,label:'',upd:(tl,D)=>{ const hs=[0,1,2,3,4,5].map(i=>ct('s03',1,-.2)+i*.4); cards.forEach((c,i)=>{const st=-.15+i*.1,v=eOB((tl-st)/.5);
        const h0=hs[i], act=tl>=h0&&tl<h0+.5, seen=tl>=hs[0];
        c.style.opacity=clamp((tl-st)/.3)*(seen&&!act&&tl<h0+.5?.7:1);
        c.style.transform=`translateY(${(1-v)*80}px) scale(${act?1.05:1})`;
        c.style.boxShadow=act?'0 0 0 6px #ff9b4a,0 24px 60px rgba(0,0,0,.5)':'';});}}; }

  /* sT 四個詞（用報表裡的真實數字當例子） */
  { const el=document.createElement('div'); el.className='scene';
    el.innerHTML=`<div class="big" style="left:0;right:0;top:76px;text-align:center;font-size:58px">先記四個詞</div><div id="sTc"></div>`;
    host.appendChild(el);
    const lab=(s)=>`<div style="font-size:25px;color:#4a5f9a;margin-bottom:6px">${s}</div>`;
    const T=[

window.init=async function(tl){

};
window.render=function(t){
  const OV=.25; let label='',pgl='';
  TL.scenes.forEach((sc,idx)=>{ const o=S[sc.k], tl=t-sc.T; const el=o.el;
    if(tl<-OV-.01||tl>sc.D+.01){el.style.display='none';return;} el.style.display='block';
    const ein=eO((tl+OV)/(OV+.12)), eout=clamp((sc.D-tl)/OV); const last=idx===TL.scenes.length-1;
    el.style.opacity=(idx===0?1:ein)*(last?1:eout);

    o.upd(Math.max(0,tl),sc.D); if(tl>=.3&&tl<sc.D-.3){label=(idx+1)+' / '+TL.scenes.length; pgl=o.label||'';}

  const sp=document.querySelector('#sub span'); sp.textContent=txt; sp.style.opacity=txt?vis:0; sp.style.display=txt?'inline-block':'none';
  document.getElementById('grid').style.transform=`translate(${-(t*6)%80}px,${-(t*4)%80}px)`;
  document.getElementById('o1').style.transform=`translate(${Math.sin(t*.2)*60}px,${Math.cos(t*.17)*40}px)`;
  document.getElementById('o2').style.transform=`translate(${Math.cos(t*.15)*50}px,${Math.sin(t*.21)*40}px)`;
  document.getElementById('prog').style.width=(100*t/TL.total)+'%';
};
